<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — EstateFlow</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); padding: 2.5rem; width: 100%; max-width: 400px; }
        .logo { text-align: center; margin-bottom: 2rem; }
        .logo h1 { font-size: 1.5rem; color: #0f172a; }
        .logo p { font-size: 0.875rem; color: #64748b; margin-top: 0.25rem; }
        label { display: block; font-size: 0.875rem; font-weight: 500; color: #334155; margin-bottom: 0.375rem; }
        input[type="text"], input[type="password"] { width: 100%; padding: 0.625rem 0.75rem; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 0.875rem; margin-bottom: 1rem; transition: border-color 0.2s; }
        input:focus { outline: none; border-color: #3b63f6; box-shadow: 0 0 0 3px rgba(59,99,246,0.15); }
        button { width: 100%; padding: 0.75rem; background: #2a47e6; color: white; border: none; border-radius: 8px; font-size: 0.875rem; font-weight: 500; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #1e36c4; }
        .error { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.875rem; margin-bottom: 1rem; }
        .helptext { display: block; font-size: 0.75rem; color: #94a3b8; margin-top: 0.25rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <h1>EstateFlow</h1>
            <p>Gestión de comunidades</p>
        </div>

        {% if form.errors %}
            <div class="error">Usuario o contraseña incorrectos</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <label for="id_username">Usuario</label>
            {{ form.username }}
            <label for="id_password">Contraseña</label>
            {{ form.password }}
            <button type="submit">Iniciar sesión</button>
        </form>
    </div>
</body>
</html>
