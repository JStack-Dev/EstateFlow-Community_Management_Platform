services:
  - type: web
    name: estateflow-backend
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn issueflow.wsgi:application --log-file -
    preDeployCommand: python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py seed_data
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: "estateflow-backend.onrender.com,.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://jstack-dev.github.io"
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: estateflow-db
          property: connectionString

databases:
  - name: estateflow-db
    region: frankfurt
    plan: free
    databaseName: estateflow
    ipAllowList: []
